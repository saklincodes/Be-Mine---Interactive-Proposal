<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Go On A Date With Me? 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Created with ❤️ by You -->
</head>
<body>
    <div class="spooky-bg">
        <span class="float-emoji" style="--i:1; --left:10%;">✨</span>
        <span class="float-emoji" style="--i:3; --left:25%;">💖</span>
        <span class="float-emoji" style="--i:2; --left:45%;">🍬</span>
        <span class="float-emoji" style="--i:4; --left:65%;">⭐</span>
        <span class="float-emoji" style="--i:1.5; --left:85%;">✨</span>
        <span class="float-emoji" style="--i:2.5; --left:92%;">🎈</span>
    </div>

    <div class="container glass-card">
        <div class="header-badge">✨ Special Invitation ✨</div>
        <h1 class="title">Will you go on a date with me? 💖</h1>
        <p class="subtitle">No tricks, just cute treats & sweet memories! ✨</p>

        <div class="gif_container">
            <img id="main-gif" src="spooky_cute.gif" alt="Cute Begging Bear with Heart">
        </div>

        <div class="buttons">
            <button id="yes-btn" class="yes-button" onclick="handleYesClick()">Yes! 💖</button>
            <button id="no-btn" class="no-button" onclick="handleNoClick()">No 🥺</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
